<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Field Chronicles: Crossroads Chapter — Broadside Display</title>
<meta name="description" content="The public noticeboard of the Codex Field Chronicles, Crossroads Chapter.">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/viewport.js"></script>
</head>
<body class="stage-page">

<div class="stage">

  <aside class="siderail left">
    <p class="brand" id="brand"><span class="bline">Codex Field Chronicles:</span><span class="bline">Crossroads Chapter —</span><span class="bline">Broadside Display</span></p>
    <nav class="railnav">
      <a href="index.html" aria-current="page">Board</a>
      <a href="archive.html">Archive</a>
      <a id="submitLink" href="#" hidden>Post a notice</a>
    </nav>
    <div class="railspace"></div>
    <p class="railnote">
      Tap any slip to read it. Notices enter at the top and work their way down;
      what leaves the bottom goes to the archive.
    </p>
  </aside>

  <div class="prop">
    <div class="rail top"></div>
    <div class="field">
      <div class="slats" id="slats"></div>
      <div class="plexi"></div>
    </div>
    <div class="rail bot"></div>
  </div>

  <aside class="siderail right">
    <div class="history" id="history" hidden>
      <div class="hrow">
        <button id="hPrev" title="Earlier state">◀</button>
        <button id="hNext" title="Later state">▶</button>
        <button id="hNow" title="Jump to the current board">Now</button>
      </div>
      <input type="range" id="hRange" min="0" max="1" value="1" aria-label="Board history">
      <div class="hlabel" id="hLabel"></div>
      <button id="replay" title="Play the slat change into this state">Replay this change</button>
    </div>
    <div class="railspace"></div>
    <p class="railnote" id="status"></p>
  </aside>

</div>

<script src="assets/layout.js"></script>
<script src="assets/tone.js"></script>
<script src="assets/slip.js"></script>
<script src="assets/board.js"></script>
</body>
</html>
